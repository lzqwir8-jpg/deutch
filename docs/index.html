<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Wortschatz-Navigator</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;500;600;700;800&family=Literata:opsz,wght@7..72,400;7..72,600&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
html{color-scheme:light}body{margin:0}img{max-width:100%}[hidden]{display:none!important}
/* Layout: a book "thumb index" (Daumenregister) of chapter tabs on the left edge, topic list beside it, topic workspace on the right. Chapter colours come from the book itself. */
:root{
  --paper:#f3f5f8; --surface:#ffffff; --sunk:#e9edf3; --ink:#1b2230; --muted:#5b6476; --line:#d9dee7;
  --accent:#24508f; --accent-ink:#ffffff; --good:#1d7a4d; --good-bg:#e1f2e8; --warn:#9a5b00;
  --ch:#24508f; --ch-ink:#fff;
  --f-ui:"Schibsted Grotesk",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-de:"Literata",Georgia,"Times New Roman",serif;
  --f-mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --r:8px; --shadow:0 1px 2px rgba(20,30,50,.06),0 4px 14px rgba(20,30,50,.06);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#11141a; --surface:#181c25; --sunk:#0d1015; --ink:#e5e9f0; --muted:#98a1b2; --line:#2a313e;
  --accent:#8fb2f2; --accent-ink:#0d1320; --good:#6fd39f; --good-bg:#16301f; --warn:#f0b35a;
  --shadow:0 1px 2px rgba(0,0,0,.4); color-scheme:dark }}
:root[data-theme="dark"]{
  --paper:#11141a; --surface:#181c25; --sunk:#0d1015; --ink:#e5e9f0; --muted:#98a1b2; --line:#2a313e;
  --accent:#8fb2f2; --accent-ink:#0d1320; --good:#6fd39f; --good-bg:#16301f; --warn:#f0b35a;
  --shadow:0 1px 2px rgba(0,0,0,.4); color-scheme:dark }
html,body{height:100%}
body{background:var(--paper);color:var(--ink);font-family:var(--f-ui);font-size:15px;line-height:1.45}
*{box-sizing:border-box}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.app{display:grid;grid-template-rows:auto 1fr;height:100%;min-height:0}

/* top bar */
.top{display:flex;align-items:center;gap:14px;padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));background:var(--surface);border-bottom:1px solid var(--line);flex-wrap:wrap}
.brand{display:flex;flex-direction:column;line-height:1.1;min-width:0}
.brand b{font-weight:800;letter-spacing:-.01em;font-size:17px}
.brand span{font-size:12px;color:var(--muted)}
.nav{display:flex;gap:4px;background:var(--sunk);padding:3px;border-radius:9px}
.nav button{border:0;background:transparent;padding:6px 12px;border-radius:7px;font-weight:600;font-size:14px;color:var(--muted)}
.nav button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.search{flex:1 1 200px;position:relative;min-width:0;max-width:520px}
.search input{width:100%;padding:8px 12px 8px 34px;border:1px solid var(--line);border-radius:9px;background:var(--paper)}
.search svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--muted)}
.pdfpill{display:flex;align-items:center;gap:8px;font-size:13px;padding:6px 10px;border-radius:999px;border:1px solid var(--line);background:var(--paper);white-space:nowrap}
.dot{width:8px;height:8px;border-radius:50%;background:var(--warn)}
.pdfpill.ok .dot{background:var(--good)}
.prog{font-size:13px;color:var(--muted);white-space:nowrap}
.prog b{color:var(--ink)}

/* body grid */
.main{display:grid;grid-template-columns:56px 300px minmax(0,1fr);min-height:0}
.tabs{background:var(--surface);border-right:1px solid var(--line);overflow-y:auto;display:flex;flex-direction:column;gap:3px;padding-block:10px}
.tab{position:relative;margin-left:8px;height:38px;border:0;border-radius:7px 0 0 7px;background:var(--c);color:var(--ci);font-weight:800;font-size:16px;display:flex;align-items:center;justify-content:center;opacity:.55;transition:opacity .15s,margin .15s}
.tab:hover{opacity:.85}
.tab[aria-current="true"]{opacity:1;margin-left:2px}
.tab .pc{position:absolute;left:3px;bottom:3px;right:3px;height:3px;border-radius:2px;background:rgba(255,255,255,.35)}
.tab .pc i{display:block;height:100%;background:currentColor;border-radius:2px}
.list{border-right:1px solid var(--line);overflow-y:auto;background:var(--paper);min-height:0}
.chhead{padding:16px 16px 10px;border-bottom:3px solid var(--ch)}
.chhead small{display:block;font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;font-weight:600}
.chhead h2{margin:2px 0 0;font-size:17px;line-height:1.25;text-wrap:balance}
.chhead .introbtn{margin-top:8px;font-size:12.5px;border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:3px 8px}
.tl{list-style:none;margin:0;padding:6px}
.tl button{width:100%;text-align:left;border:0;background:transparent;border-radius:7px;padding:7px 8px;display:grid;grid-template-columns:24px minmax(0,1fr) auto;gap:6px;align-items:baseline}
.tl button:hover{background:var(--sunk)}
.tl button[aria-current="true"]{background:var(--surface);box-shadow:var(--shadow)}
.tl .n{font-family:var(--f-mono);font-size:12.5px;color:var(--muted);text-align:right}
.tl .tt{font-size:14px;line-height:1.3}
.tl .pg{font-family:var(--f-mono);font-size:11.5px;color:var(--muted)}
.tl .done .tt{color:var(--muted)}
.tl .done .n{color:var(--good)}
.tl .here .tt{font-weight:700}
.flag{display:inline-block;font-size:10.5px;font-weight:700;border-radius:4px;padding:0 4px;margin-left:4px;vertical-align:1px}
.flag.b2{color:var(--ch);border:1px solid currentColor}
.flag.here{background:var(--accent);color:var(--accent-ink)}

.work{overflow-y:auto;min-height:0}
.wrap{max-width:1180px;padding-block:20px 60px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* topic header */
.th{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:16px;align-items:start}
.eyebrow{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted);font-weight:600}
.chip{display:inline-flex;align-items:center;justify-content:center;min-width:24px;height:24px;padding:0 6px;border-radius:5px;background:var(--ch);color:var(--ch-ink);font-weight:800;font-size:13px}
h1{margin:6px 0 8px;font-size:30px;line-height:1.12;letter-spacing:-.015em;text-wrap:balance}
h1 .num{color:var(--ch);margin-right:10px}
.meta{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.tag{font-size:12.5px;border:1px solid var(--line);border-radius:999px;padding:2px 9px;background:var(--surface);color:var(--muted)}
.tag strong{color:var(--ink);font-weight:600}
.summary{max-width:68ch;margin:0;color:var(--ink)}
.ctrl{display:flex;flex-direction:column;gap:8px;align-items:stretch;min-width:210px}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 12px;font-weight:600;font-size:14px;display:inline-flex;align-items:center;justify-content:center;gap:7px}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.good{background:var(--good-bg);color:var(--good);border-color:transparent}
.btn.sm{padding:5px 9px;font-size:13px;font-weight:600}
.btn[disabled]{opacity:.45;cursor:default}
.row{display:flex;gap:8px;flex-wrap:wrap}
.nextup{margin-top:18px;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.nu{border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:10px 12px;text-align:left;display:flex;gap:10px;align-items:center;min-width:0}
.nu:hover{border-color:var(--muted)}
.nu .k{font-size:11.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:700}
.nu .v{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nu>div{min-width:0}
.nu.next{justify-content:space-between;text-align:right}
.nu.next>div{margin-left:auto}

/* section tabs */
.stabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin:22px 0 16px;overflow-x:auto}
.stabs button{border:0;background:transparent;padding:9px 14px;font-weight:600;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap}
.stabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--ch)}
.stabs .cnt{font-family:var(--f-mono);font-size:12px;color:var(--muted);margin-left:4px}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between;margin-bottom:14px}
.seg{display:inline-flex;background:var(--sunk);border-radius:8px;padding:3px}
.seg button{border:0;background:transparent;padding:5px 10px;border-radius:6px;font-size:13.5px;font-weight:600;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}

/* image cards */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;display:flex;flex-direction:column;min-width:0}
.card .img{background:#fff;aspect-ratio:auto;display:flex;align-items:flex-start;justify-content:center;max-height:340px;overflow:hidden;border-bottom:1px solid var(--line);cursor:zoom-in;position:relative}
.card .img img{width:100%;height:auto;display:block}
.card .img .ph{width:100%;height:180px;display:flex;align-items:center;justify-content:center;color:#7a8394;font-size:13px;background:repeating-linear-gradient(135deg,#f2f4f7 0 10px,#eceff3 10px 20px)}
.card .img.tall::after{content:"";position:absolute;left:0;right:0;bottom:0;height:40px;background:linear-gradient(transparent,rgba(255,255,255,.95))}
.card .cap{padding:10px 12px;display:flex;flex-direction:column;gap:4px;flex:1}
.card .lab{display:flex;align-items:center;gap:6px;font-weight:700}
.card .lab .pg{margin-left:auto;font-family:var(--f-mono);font-size:12px;color:var(--muted);font-weight:400}
.card .de{font-family:var(--f-de);font-size:14px}
.card .ru{font-size:13px;color:var(--muted)}
.card.queued{outline:3px solid var(--accent);outline-offset:-1px}
.pickbar{position:sticky;bottom:0;background:var(--surface);border-top:1px solid var(--line);padding:10px 12px calc(10px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:8px;font-size:13.5px}
.tl button[aria-pressed="true"]{background:var(--surface);box-shadow:inset 3px 0 0 var(--accent)}
.pk{display:flex;gap:6px;align-items:center;font-size:13px;color:var(--muted);margin-top:4px;cursor:pointer}
.pagesrow{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:-4px 0 14px;font-size:13.5px;color:var(--muted)}
.card .acts{display:flex;gap:6px;padding:0 12px 12px}
.star{color:var(--ch)}

/* words */
.wt{width:100%;border-collapse:collapse;font-size:14.5px}
.wt td{padding:7px 8px;border-bottom:1px solid var(--line);vertical-align:top}
.wt td.de{font-family:var(--f-de);font-weight:600;width:44%}
.wt td.lv{width:46px;text-align:right}
.lv{font-family:var(--f-mono);font-size:11.5px;color:var(--muted)}
.lv.B2,.lv.C1{color:var(--ch);font-weight:600}
.tw{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:4px 8px}
h3{font-size:15px;margin:22px 0 8px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
.box{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:14px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px;margin-bottom:12px}
.box h4{margin:0 0 4px;font-size:16px;font-family:var(--f-de)}
.box .kind{font-size:11px;text-transform:uppercase;letter-spacing:.07em;font-weight:700;color:var(--muted)}
.box .img{cursor:zoom-in;background:#fff;border-radius:6px;overflow:hidden;border:1px solid var(--line)}
.box .img img{display:block;width:100%}

/* connect panel */
.connect{border:2px dashed var(--line);border-radius:12px;padding:18px;background:var(--surface);display:flex;gap:16px;align-items:center;flex-wrap:wrap;margin-bottom:16px}
.connect.drag{border-color:var(--accent)}
.connect p{margin:0;max-width:60ch;color:var(--muted);font-size:14px}
.connect strong{display:block;color:var(--ink);font-size:15px;margin-bottom:2px}

/* map & index */
.mapch{margin-bottom:18px}
.mapch h2{font-size:16px;margin:0 0 8px;display:flex;gap:8px;align-items:center}
.mapch .tops{display:flex;flex-wrap:wrap;gap:6px}
.mt{border:1px solid var(--line);background:var(--surface);border-radius:7px;padding:5px 9px;font-size:13px;display:flex;gap:6px;align-items:baseline;max-width:100%}
.mt .n{font-family:var(--f-mono);font-size:11.5px;color:var(--muted)}
.mt.done{background:var(--good-bg);border-color:transparent}
.mt.here{outline:2px solid var(--accent)}
.idx{columns:2 340px;column-gap:28px}
.idx .it{break-inside:avoid;padding:7px 0;border-bottom:1px solid var(--line);display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;cursor:pointer}
.idx .it:hover .de{text-decoration:underline}
.idx .de{font-family:var(--f-de);font-weight:600}
.idx .ru{font-size:13px;color:var(--muted)}
.idx .where{font-family:var(--f-mono);font-size:12px;color:var(--muted);white-space:nowrap}

/* search results */
.sr{position:absolute;left:0;right:0;top:calc(100% + 6px);background:var(--surface);border:1px solid var(--line);border-radius:10px;box-shadow:0 12px 40px rgba(10,20,40,.18);max-height:min(70vh,560px);overflow-y:auto;z-index:30;padding:6px}
.sr h5{margin:8px 8px 4px;font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted)}
.sr button{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;width:100%;text-align:left;border:0;background:transparent;border-radius:6px;padding:6px 8px}
.sr button:hover,.sr button.sel{background:var(--sunk)}
.sr .a{font-weight:600}
.sr .b{font-size:12.5px;color:var(--muted)}
.sr .w{font-family:var(--f-mono);font-size:12px;color:var(--muted);white-space:nowrap}
.sr .none{padding:10px;color:var(--muted)}

/* viewer */
.viewer{position:fixed;inset:0;background:rgba(8,12,20,.82);z-index:50;display:grid;grid-template-rows:auto 1fr;padding-top:env(safe-area-inset-top,0px)}
.viewer .vb{display:flex;gap:8px;align-items:center;padding:10px max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px));color:#fff;flex-wrap:wrap}
.viewer .vb .t{font-weight:600;margin-right:auto}
.viewer .vb .btn{background:#1d2330;color:#fff;border-color:#3a4356}
.viewer .vi{overflow:auto;display:flex;justify-content:center;padding:0 16px 24px}
.viewer img{max-width:min(100%,900px);height:auto;background:#fff;border-radius:4px;align-self:flex-start}
.toast .undo{margin-left:12px;border:0;background:transparent;color:var(--accent);font-weight:700;text-decoration:underline;padding:0}
:root .toast .undo{color:#9fc0ff}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:10px 16px;border-radius:9px;font-size:14px;z-index:60;max-width:calc(100% - 32px);box-shadow:0 8px 30px rgba(0,0,0,.25)}
.hint{font-size:13px;color:var(--muted)}
.kbd{font-family:var(--f-mono);font-size:11.5px;border:1px solid var(--line);border-bottom-width:2px;border-radius:4px;padding:0 4px;background:var(--surface)}
.menu-btn{display:none}
.settings{background:var(--surface);color:var(--ink);border-radius:12px;padding:20px;max-width:620px;width:100%;display:flex;flex-direction:column;gap:6px;margin-top:6vh}
.settings h2{margin:0 0 4px}
.settings label{font-weight:600;font-size:13.5px;margin-top:8px}
.settings input,.note input{padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--paper);width:100%;min-width:0}
.lesson{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin-bottom:12px}
.lesson .lh{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap;margin-bottom:8px}
.lesson h2{margin:0;font-size:18px}
.lesson .tops{display:flex;flex-wrap:wrap;gap:6px}
.lesson .note{margin-top:10px}
.lesson .note .row{flex-wrap:nowrap}
.lessonbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:-4px 0 14px;font-size:13.5px;color:var(--muted)}
.lessonbar b{color:var(--ink)}
.empty{padding:28px;text-align:center;color:var(--muted);background:var(--surface);border:1px dashed var(--line);border-radius:var(--r)}

@media (max-width:1480px){ .brand span{display:none} }
@media (max-width:1460px){ .prog{display:none} }
@media (max-width:980px){
  .main{grid-template-columns:minmax(0,1fr);grid-template-rows:auto minmax(0,1fr)}
  .tabs{flex-direction:row;overflow-x:auto;overflow-y:hidden;border-right:0;border-bottom:1px solid var(--line);padding:8px max(16px,env(safe-area-inset-left,0px)) 0;gap:4px}
  .tab{margin-left:0;width:38px;flex:0 0 38px;border-radius:7px 7px 0 0;height:34px}
  .tab[aria-current="true"]{margin-left:0;transform:translateY(0)}
  .list{position:fixed;left:0;top:0;bottom:0;width:min(340px,88vw);z-index:40;box-shadow:0 0 40px rgba(0,0,0,.3);transform:translateX(-105%);transition:transform .2s;padding-top:env(safe-area-inset-top,0px)}
  .list.open{transform:none}
  .menu-btn{display:inline-flex}
  .th{grid-template-columns:minmax(0,1fr)}
  .ctrl{flex-direction:row;flex-wrap:wrap;min-width:0}
  .ctrl .btn{flex:1 1 auto}
  .box{grid-template-columns:minmax(0,1fr)}
  h1{font-size:25px}
}
@media (max-width:560px){ .nextup{grid-template-columns:minmax(0,1fr)} .prog{display:none} .brand span{display:none} }
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>

<div class="app" id="app">
  <header class="top">
    <button class="btn sm menu-btn" id="menuBtn" aria-label="Список тем">☰ Темы</button>
    <div class="brand"><b>Wortschatz A2–C1</b><span>Навигатор по «Großes Übungsbuch Wortschatz aktuell»</span></div>
    <nav class="nav" aria-label="Разделы">
      <button id="nvTopic" aria-pressed="true">Тема</button>
      <button id="nvMap" aria-pressed="false">Карта книги</button>
      <button id="nvIndex" aria-pressed="false">Указатель</button>
      <button id="nvLessons" aria-pressed="false">Уроки</button>
      <button id="nvPick" aria-pressed="false">Подборка</button>
    </nav>
    <div class="search">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input id="q" type="search" placeholder="Тема, слово (de/ru), правило, страница… (нажмите /)" autocomplete="off" aria-label="Поиск">
      <div class="sr" id="sr" hidden></div>
    </div>
    <div class="prog" id="prog"></div>
    <button class="pdfpill" id="syncPill" title=""><span class="dot"></span><span>Прогресс: только этот браузер</span></button>
    <button class="pdfpill" id="pdfPill" title="Файл книги"><span class="dot"></span><span id="pdfTxt">PDF не подключён</span></button>
  </header>
  <div class="main">
    <nav class="tabs" id="tabs" aria-label="Главы"></nav>
    <aside class="list" id="list"></aside>
    <main class="work" id="work"><div class="wrap" id="view"><p class="hint">Загрузка…</p></div></main>
  </div>
</div>
<input type="file" id="file" accept="application/pdf,.pdf" hidden>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script>
"use strict";
/* ---------- state ---------- */
let D=null, TOP=[], BYID={}, CH={};
const S={lesson:0, lessons:[], view:'topic', cur:'A1', sel:'A1', chapter:'A', tab:'img', mode:'ex', showSol:false, lvl:'all', done:{}, pdf:null, offs:null};
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

const lsGet=k=>{try{return JSON.parse(localStorage.getItem(k))}catch(e){return null}};

function ink(hex){const n=parseInt(hex.slice(1),16),r=n>>16,g=n>>8&255,b=n&255;return (0.299*r+0.587*g+0.114*b)>160?'#1b2230':'#ffffff'}

/* ---------- progress store: Google Sheet (Apps Script) or this browser ---------- */
const CFG={url:'',key:'',who:''};
const SYNC={mode:'local',state:'idle',at:null,err:''};
function loadCfg(){const c=lsGet('wz-cfg');if(c){CFG.url=c.url||'';CFG.key=c.key||'';CFG.who=c.who||''}SYNC.mode=CFG.url&&CFG.key?'sheet':'local'}
function saveCfg(){lsSet('wz-cfg',CFG);SYNC.mode=CFG.url&&CFG.key?'sheet':'local'}
function readHashCfg(){
  const m=/[#&]c=([^&]+)/.exec(location.hash); if(!m) return false;
  try{const o=JSON.parse(decodeURIComponent(escape(atob(decodeURIComponent(m[1])))));if(o.u&&o.k){CFG.url=o.u;CFG.key=o.k;saveCfg()}}catch(e){}
  history.replaceState(null,'',location.pathname+location.search); return true;
}
function shareLink(){const s=btoa(unescape(encodeURIComponent(JSON.stringify({u:CFG.url,k:CFG.key}))));return location.origin+location.pathname+'#c='+encodeURIComponent(s)}
function applyState(st){
  if(!st) return;
  if(st.cur&&BYID[st.cur]) S.cur=st.cur;
  S.done=st.done||{}; S.lesson=st.lesson||0; S.lessons=st.lessons||[];
  const had=S.drive; S.drive=!!st.book&&SYNC.mode==='sheet';
  if(!S.pdf) setPill(S.drive?'Книга: Google Диск':'PDF не подключён',S.drive);
  if(S.drive!==had) {thumbCache.clear();bmpCache.clear()}
  lsSet('wz-progress',{cur:S.cur,done:S.done,lesson:S.lesson,lessons:S.lessons});
}
async function api(action,payload){
  if(action==='state'){
    const r=await fetch(`${CFG.url}?action=state&key=${encodeURIComponent(CFG.key)}`,{cache:'no-store'});
    return r.json();
  }
  const r=await fetch(CFG.url,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(Object.assign({action,key:CFG.key,who:CFG.who},payload||{}))});
  return r.json();
}
function setSync(state,err){SYNC.state=state;SYNC.err=err||'';if(state==='ok')SYNC.at=new Date();renderSync()}
function renderSync(){
  const el=$('#syncPill'); if(!el) return;
  const t={local:'Прогресс: только этот браузер',idle:'Таблица',busy:'Сохраняю…',ok:'Таблица ✓',err:'Таблица: ошибка'};
  el.querySelector('span:last-child').textContent=SYNC.mode==='local'?t.local:(t[SYNC.state]||'Таблица');
  el.classList.toggle('ok',SYNC.mode==='sheet'&&SYNC.state==='ok');
  el.title=SYNC.err||(SYNC.at?'Синхронизировано '+SYNC.at.toLocaleTimeString():'');
}
async function pull(quiet){
  if(SYNC.mode!=='sheet') return;
  try{setSync('busy');const j=await api('state');if(!j.ok) throw new Error(j.error);
    const before=JSON.stringify([S.cur,S.done,S.lesson,S.lessons,S.drive]);applyState(j.state);setSync('ok');
    if(before!==JSON.stringify([S.cur,S.done,S.lesson,S.lessons,S.drive])) render();
  }catch(e){setSync('err',errText(e));if(!quiet) toast('Не удалось прочитать таблицу: '+errText(e),5000)}
}
function errText(e){const m=String(e&&e.message||e);return m==='bad_key'?'неверный ключ':(m.includes('Failed to fetch')?'нет связи со скриптом (проверьте адрес и доступ «Все»)':m)}
const today=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
// apply an operation locally (optimistic), then send it to the sheet
function applyLocal(op,p){
  if(op==='setCur') S.cur=p.id;
  if(op==='done') S.done[p.id]={d:today(),l:S.lesson||0,by:CFG.who};
  if(op==='undone') delete S.done[p.id];
  if(op==='doneNext'){S.done[p.id]={d:today(),l:S.lesson||0,by:CFG.who};const nx=TOP[TOP.indexOf(BYID[p.id])+1];if(nx) S.cur=nx.id}
  if(op==='newLesson'){const n=Math.max(S.lesson||0,...S.lessons.map(l=>l.n),0)+1;S.lessons.push({n,date:today(),note:''});S.lesson=n}
  if(op==='deleteLesson'){S.lessons=S.lessons.filter(l=>l.n!==p.n);Object.values(S.done).forEach(d=>{if(d.l===p.n)d.l=0});S.lesson=Math.max(0,...S.lessons.map(l=>l.n))}
  if(op==='note'){const l=S.lessons.find(l=>l.n===p.n);if(l) l.note=p.text}
  lsSet('wz-progress',{cur:S.cur,done:S.done,lesson:S.lesson,lessons:S.lessons});
}
let queue=Promise.resolve();
// «Начать урок» сначала только запоминается здесь; в таблицу урок уходит вместе с первой отмеченной темой.
// Поэтому случайное нажатие отменяется без следа в таблице.
let PENDING=lsGet('wz-pending');
const nextLessonNo=()=>Math.max(S.lesson||0,...S.lessons.map(l=>l.n),0)+1;
function startLesson(){PENDING={date:today()};lsSet('wz-pending',PENDING);render()}
function cancelPending(){PENDING=null;lsSet('wz-pending',null);render()}
function op(name,payload){
  if(PENDING&&(name==='done'||name==='doneNext')){PENDING=null;lsSet('wz-pending',null);op('newLesson')}
  applyLocal(name,payload||{}); render();
  if(SYNC.mode!=='sheet') return;
  queue=queue.then(async()=>{
    try{setSync('busy');const j=await api(name,payload);if(!j.ok) throw new Error(j.error);applyState(j.state);setSync('ok');render()}
    catch(e){setSync('err',errText(e));toast('Не сохранилось в таблицу: '+errText(e)+'. Отметка осталась в этом браузере.',6000)}
  });
}
async function deleteLessonSafe(n){
  const manual=`Удалите урок в таблице: лист «Уроки» — удалите строку урока №${n}; лист «Состояние» — в «Текущий урок №» поставьте предыдущий номер. Сайт подхватит изменения.`;
  if(SYNC.mode!=='sheet'){applyLocal('deleteLesson',{n});render();toast(`Урок №${n} удалён`);return}
  try{setSync('busy');const j=await api('deleteLesson',{n});
    if(!j.ok){ if(j.error==='unknown_action'){setSync('ok');toast(manual,12000);return} throw new Error(j.error) }
    applyState(j.state);setSync('ok');render();toast(`Урок №${n} удалён. Темы остались пройденными, но без номера урока.`,5000);
  }catch(e){setSync('err',errText(e));toast('Не получилось: '+errText(e),6000)}
}

/* ---------- PDF: kept in this browser only (IndexedDB) ---------- */
let _idb=null;
function idb(){if(_idb) return _idb;_idb=new Promise((res,rej)=>{const r=indexedDB.open('wz-pdf',2);r.onupgradeneeded=()=>{const d=r.result;if(!d.objectStoreNames.contains('f'))d.createObjectStore('f');if(!d.objectStoreNames.contains('pages'))d.createObjectStore('pages')};r.onsuccess=()=>res(r.result);r.onerror=()=>{_idb=null;rej(r.error)}});return _idb}
async function cacheGet(p){try{const db=await idb();return await new Promise(res=>{const r=db.transaction('pages').objectStore('pages').get(p);r.onsuccess=()=>res(r.result||null);r.onerror=()=>res(null)})}catch(e){return null}}
async function cachePut(p,blob){try{const db=await idb();db.transaction('pages','readwrite').objectStore('pages').put(blob,p)}catch(e){}}
const hasBook=()=>!!(S.pdf||S.drive);
/* pages from the PDF in Google Drive, through the Apps Script; batched and cached in this browser */
const driveWait=new Map(); let driveTimer=null;
function drivePage(p){
  if(driveWait.has(p)) return driveWait.get(p).promise;
  let resolve,reject;const promise=new Promise((a,b)=>{resolve=a;reject=b});
  driveWait.set(p,{promise,resolve,reject,sent:false});
  clearTimeout(driveTimer);driveTimer=setTimeout(flushDrive,25);
  return promise;
}
async function flushDrive(){
  const todo=[...driveWait.entries()].filter(([p,w])=>!w.sent).map(([p])=>p);
  for(let i=0;i<todo.length;i+=4){
    const batch=todo.slice(i,i+4); batch.forEach(p=>driveWait.get(p).sent=true);
    (async()=>{
      try{
        const r=await fetch(`${CFG.url}?action=pages&ps=${batch.join(',')}&key=${encodeURIComponent(CFG.key)}`);
        const j=await r.json(); if(!j.ok) throw new Error(j.error);
        batch.forEach(p=>{const b64=j.pages[p];const bin=atob(b64);const u=new Uint8Array(bin.length);for(let k=0;k<bin.length;k++)u[k]=bin.charCodeAt(k);
          const blob=new Blob([u],{type:'image/jpeg'});cachePut(p,blob);driveWait.get(p).resolve(blob);driveWait.delete(p)});
      }catch(e){batch.forEach(p=>{const w=driveWait.get(p);if(w){w.reject(e);driveWait.delete(p)}})}
    })();
  }
}
async function pageBlob(p){
  if(S.pdf){const [s,l]=S.offs[p];return new Blob([S.pdf.slice(s,s+l)],{type:'image/jpeg'})}
  const c=await cacheGet(p); if(c) return c;
  return drivePage(p);
}
async function idbPut(blob){try{const db=await idb();await new Promise((res,rej)=>{const tx=db.transaction('f','readwrite');tx.objectStore('f').put(blob,'book');tx.oncomplete=res;tx.onerror=()=>rej(tx.error)})}catch(e){}}
async function idbGet(){try{const db=await idb();return await new Promise((res)=>{const tx=db.transaction('f');const r=tx.objectStore('f').get('book');r.onsuccess=()=>res(r.result||null);r.onerror=()=>res(null)})}catch(e){return null}}

async function scanPdf(blob){
  // generic: find every DCTDecode image stream in file order
  const buf=new Uint8Array(await blob.arrayBuffer());
  const txt=new TextDecoder('latin1');
  const out=[]; const pat=[47,68,67,84,68,101,99,111,100,101]; // "/DCTDecode"
  for(let i=0;i<buf.length-12;i++){
    if(buf[i]!==47||buf[i+1]!==68||buf[i+2]!==67) continue;
    let ok=true;for(let k=3;k<pat.length;k++) if(buf[i+k]!==pat[k]){ok=false;break}
    if(!ok) continue;
    const dictStart=Math.max(0,i-600); const head=txt.decode(buf.subarray(dictStart,i+600));
    const rel=i-dictStart; const m=/\/Length\s+(\d+)(?!\s+\d+\s+R)/.exec(head.slice(Math.max(0,rel-500)));
    let s=i; while(s<buf.length-6 && !(buf[s]===115&&buf[s+1]===116&&buf[s+2]===114&&buf[s+3]===101&&buf[s+4]===97&&buf[s+5]===109)) s++;
    s+=6; if(buf[s]===13) s++; if(buf[s]===10) s++;
    if(buf[s]!==0xFF||buf[s+1]!==0xD8) continue;
    let len=m?+m[1]:0;
    if(!len||buf[s+len-2]!==0xFF||buf[s+len-1]!==0xD9){ let e=s+2; while(e<buf.length-1 && !(buf[e]===0xFF&&buf[e+1]===0xD9&&String.fromCharCode(...buf.subarray(e+2,e+14)).includes('endstream'))) e++; len=e+2-s; }
    out.push([s,len]); i=s+len;
  }
  return out;
}
async function attachPdf(blob,store){
  setPill('Читаю PDF…',false);
  let offs=null;
  if(blob.size===D.pdf.size){
    const [s]=D.pdf.off[0]; const h=new Uint8Array(await blob.slice(s,s+2).arrayBuffer());
    if(h[0]===0xFF&&h[1]===0xD8) offs=D.pdf.off;
  }
  if(!offs){ try{offs=await scanPdf(blob)}catch(e){offs=[]} }
  if(offs.length<D.pdf.pages){ setPill('Это не та книга',false); toast(`В файле найдено ${offs.length} страниц-картинок, а в книге их ${D.pdf.pages}. Нужен PDF «Deutsch Großes Übungsbuch Wortschatz aktuell A2–C1».`,6000); return false }
  S.pdf=blob; S.offs=offs; bmpCache.clear(); thumbCache.clear();
  if(store) await idbPut(blob);
  setPill('PDF подключён',true); render(); return true;
}
function setPill(t,ok){$('#pdfTxt').textContent=t;$('#pdfPill').classList.toggle('ok',!!ok)}

/* ---------- image pipeline ---------- */
const bmpCache=new Map(), thumbCache=new Map();
async function pageBitmap(p){
  if(bmpCache.has(p)){const v=bmpCache.get(p);bmpCache.delete(p);bmpCache.set(p,v);return v}
  const bmp=pageBlob(p).then(b=>createImageBitmap(b)); bmpCache.set(p,bmp); bmp.catch(()=>bmpCache.delete(p));
  if(bmpCache.size>14){const k=bmpCache.keys().next().value;bmpCache.get(k).then(b=>b.close&&b.close());bmpCache.delete(k)}
  return bmp;
}
// region: {p,x0,y0,x1,y1}
async function drawRegions(regs,scale=1,gap=16){
  const bms=await Promise.all(regs.map(r=>pageBitmap(r.p)));
  const W=Math.round(Math.max(...regs.map(r=>r.x1-r.x0))*scale);
  const H=Math.round((regs.reduce((a,r)=>a+(r.y1-r.y0),0)+gap*(regs.length-1))*scale);
  const c=document.createElement('canvas');c.width=W;c.height=H;const g=c.getContext('2d');
  g.fillStyle='#fff';g.fillRect(0,0,W,H);
  let y=0;regs.forEach((r,i)=>{const w=(r.x1-r.x0)*scale,h=(r.y1-r.y0)*scale;g.drawImage(bms[i],r.x0,r.y0,r.x1-r.x0,r.y1-r.y0,0,y,w,h);y+=h+gap*scale;
    if(i<regs.length-1){g.fillStyle='#dfe3ea';g.fillRect(0,y-gap*scale/2-1,W,2);g.fillStyle='#fff'}});
  return c;
}
const toBlob=(c,type='image/png',q)=>new Promise(r=>c.toBlob(r,type,q));
async function thumb(key,regs){
  if(thumbCache.has(key)) return thumbCache.get(key);
  const pr=drawRegions(regs,0.55).then(c=>toBlob(c,'image/jpeg',0.82)).then(b=>URL.createObjectURL(b));
  thumbCache.set(key,pr); return pr;
}
const X0=10,X1=1070;

async function copyRegions(regs){

    const item=new ClipboardItem({'image/png':drawRegions(regs,1).then(c=>toBlob(c))});

  }catch(e){ toast('Браузер не дал скопировать картинку. Используйте «Скачать» или откройте картинку и перетащите её на доску.',5000) }

// all items at once: one stitched PNG (boards) + separate images as HTML (Docs, Slides, OneNote, Word)
async function copyAllItems(items){
  if(!hasBook()){needPdf();return}
  try{
    if(!navigator.clipboard||!window.ClipboardItem) throw new Error('no');
    const regs=items.flatMap(it=>it.regs);
    const png=drawRegions(regs,1).then(c=>toBlob(c));
    const html=Promise.all(items.map(it=>drawRegions(it.regs,1).then(c=>c.toDataURL('image/jpeg',0.9))))
      .then(urls=>new Blob([urls.map((u,i)=>`<p><b>${esc(items[i].label)}</b></p><p><img src="${u}"></p>`).join('')],{type:'text/html'}));
    try{ await navigator.clipboard.write([new ClipboardItem({'image/png':png,'text/html':html})]); }
    catch(e){ await navigator.clipboard.write([new ClipboardItem({'image/png':drawRegions(regs,1).then(c=>toBlob(c))})]); }
    toast(`Скопировано ${items.length} шт.: на доску вставится одной картинкой, в Google Docs/Slides, OneNote, Word — отдельными`,5000);
  }catch(e){ toast('Браузер не дал скопировать. Используйте «По очереди» или «Скачать файлами».',5000) }
}

const QUEUE={key:'',i:0};

async function copyNext(items,key){
  if(!hasBook()){needPdf();return}
  key=key||ctxKey(); if(QUEUE.key!==key){QUEUE.key=key;QUEUE.i=0}
  if(QUEUE.i>=items.length) QUEUE.i=0;
  const it=items[QUEUE.i];
  document.querySelectorAll('.card.queued').forEach(c=>c.classList.remove('queued'));
  const card=document.querySelector(`.card[data-key="${it.key}"]`); if(card){card.classList.add('queued');card.scrollIntoView({block:'nearest',behavior:'smooth'})}
  try{
    await navigator.clipboard.write([new ClipboardItem({'image/png':drawRegions(it.regs,1).then(c=>toBlob(c))})]);
    QUEUE.i++;
    const b=document.querySelector('[data-act="copynext"],[data-act="pkcopynext"]'); if(b) b.innerHTML=nextLabel(items,key);
    toast(`${it.label} в буфере (${QUEUE.i}/${items.length}) — Ctrl+V на доске, потом снова «По очереди» или клавиша C`,4000);
  }catch(e){toast('Браузер не дал скопировать картинку. Используйте «Скачать файлами».',5000)}
}
function nextLabel(items,key){key=key||ctxKey();const i=QUEUE.key===key?QUEUE.i:0;return i>=items.length?'По очереди: заново ↺':`По очереди ▶ <span class="mono">${i+1}/${items.length}</span>`}
async function downloadAllFiles(items){
  if(!hasBook()){needPdf();return}
  toast(`Скачиваю ${items.length} файлов… браузер может спросить разрешение на несколько загрузок`,4000);
  for(const it of items){ const c=await drawRegions(it.regs,1); await saveFile(it.name+'.png',await toBlob(c)); await new Promise(r=>setTimeout(r,350)); }
}
async function saveFile(name,blob){
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();
  setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},4000);
}
async function downloadRegions(name,regs){
  if(!hasBook()){needPdf();return}
  const c=await drawRegions(regs,1); await saveFile(name+'.png',await toBlob(c));

async function zipItems(name,items){
  if(!hasBook()){needPdf();return}
  if(!window.JSZip){toast('Архиватор не загрузился, скачайте картинки по одной');return}
  toast('Собираю архив…',1500);
  const z=new JSZip();
  for(const it of items){const c=await drawRegions(it.regs,1);z.file(it.name+'.jpg',await toBlob(c,'image/jpeg',0.92))}
  const blob=await z.generateAsync({type:'blob'});
  await saveFile(name+'.zip',blob);
}

/* ---------- search ---------- */
let CONC=null;
function norm(s){return s.toLowerCase().normalize('NFKD').replace(/[̀-ͯ]/g,'').replace(/ß/g,'ss').replace(/ё/g,'е')}
function search(q){
  const n=norm(q.trim()); if(n.length<2) return null;
  const res={topics:[],words:[],rules:[],pages:[]};
  const num=/^\d{1,3}$/.test(n)?+n:null;
  if(num!==null){ const t=TOP.find(t=>t.g.some(g=>g[0]===num)); if(t) res.topics.push({t,why:`страница ${num}`,page:num}); else if(num<=400) res.pages.push({w:'страница '+num,ps:[num]}) }
  const tid=/^([a-p])\s*(\d{1,2})$/i.exec(q.trim()); if(tid&&BYID[tid[1].toUpperCase()+tid[2]]) res.topics.push({t:BYID[tid[1].toUpperCase()+tid[2]],why:'тема'});
  for(const t of TOP){
    if(res.topics.length>=12) break;
    if(norm(t.t).includes(n)||norm(t.sum).includes(n)||t.tags.some(x=>norm(x).includes(n))) res.topics.push({t,why:pages(t)});
  }
  for(const t of TOP){
    for(const w of t.w.concat(t.id_,t.ph)){ if(res.words.length>=30) break;
      if(norm(w[0]).includes(n)||norm(w[1]).includes(n)) res.words.push({w,t});}
    for(const b of t.bx){ if(res.rules.length>=12) break; if(norm(b.t).includes(n)||norm(b.ru).includes(n)) res.rules.push({b,t}); }
  }
  if(!CONC){CONC=D.concord.split('\n').map(l=>{const [w,ps]=l.split('\t');return [norm(w),w,ps]})}
  if(n.length>=3) for(const [k,w,ps] of CONC){ if(res.pages.length>=10) break; if(k.startsWith(n)) res.pages.push({w,ps:ps.split(',').map(Number)}) }
  return res;
}

  const q=$('#q').value; const r=search(q); const box=$('#sr');
  if(!r){box.hidden=true;return}

   +sec('Встречается в тексте страниц',r.pages,x=>`<div style="padding:4px 8px"><span class="a" style="font-family:var(--f-de)">${esc(x.w)}</span> <span class="b">— стр.</span> ${x.ps.slice(0,14).map(p=>`<button class="btn sm" style="display:inline-flex;width:auto;padding:1px 7px;margin:2px" data-page="${p}">${p}</button>`).join('')}</div>`);

async function openViewer(title,regs,key){
  if(!hasBook()){needPdf();return}
  const v=document.createElement('div');v.className='viewer';v.tabIndex=-1;
  const pg=regs.length===1&&regs[0].x0===0&&regs[0].y1===1392?regs[0].p:null;
  v.innerHTML=`<div class="vb"><span class="t">${esc(title)}</span>${pg!==null?`<button class="btn sm" data-vp="${pg-1}">← стр. ${pg-1}</button><button class="btn sm" data-vp="${pg+1}">стр. ${pg+1} →</button>`:''}${pg!==null&&topicOfPage(pg)?`<button class="btn sm" data-vgoto="${topicOfPage(pg).id}">К теме ${topicOfPage(pg).id}</button>`:''}<button class="btn sm" data-vc>Копировать</button><button class="btn sm" data-vd>Скачать</button><button class="btn sm" data-vx>Закрыть ✕</button></div><div class="vi"><p style="color:#fff">…</p></div>`;
  document.body.appendChild(v); v.focus();
  const c=await drawRegions(regs,1); const url=URL.createObjectURL(await toBlob(c,'image/jpeg',0.9));
  v.querySelector('.vi').innerHTML=`<img src="${url}" alt="${esc(title)}">`;
  const close=()=>{v.remove();URL.revokeObjectURL(url)};
  v.addEventListener('click',e=>{
    if(e.target===v||e.target.classList.contains('vi')||e.target.closest('[data-vx]')) close();
    else if(e.target.closest('[data-vc]')) copyRegions(regs);
    else if(e.target.closest('[data-vd]')) downloadRegions(slug(title)||'bild',regs);
    else if(e.target.closest('[data-vp]')){const p=+e.target.closest('[data-vp]').dataset.vp;if(p>=0&&p<D.pdf.pages){close();openPage(p)}}
    else if(e.target.closest('[data-vgoto]')){close();goto(e.target.closest('[data-vgoto]').dataset.vgoto)}
  });
  v.addEventListener('keydown',e=>{if(e.key==='Escape')close();if(pg!==null&&e.key==='ArrowRight'&&pg+1<D.pdf.pages){close();openPage(pg+1)}if(pg!==null&&e.key==='ArrowLeft'&&pg>0){close();openPage(pg-1)}e.stopPropagation()});
}

  if(ui&&ui.sel&&BYID[ui.sel]){S.sel=ui.sel;S.chapter=ui.sel[0]}
  render();
  if(SYNC.mode==='sheet'){ await pull(false); if(fromLink&&SYNC.state==='ok'){ if(!CFG.who) setTimeout(openSettings,300); toast('Таблица прогресса подключена по ссылке') } }
  const saved=await idbGet(); if(saved) attachPdf(saved,false);
})();
</script>
